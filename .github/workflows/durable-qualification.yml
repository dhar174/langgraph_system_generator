name: Credential-free durable qualification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/380-postmerge-durable-qualification']

permissions:
  contents: read

concurrency:
  group: durable-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-without-gcp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'
      - name: Install runtime and tests without the cloud extra
        timeout-minutes: 10
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt -e . psutil
      - name: Core imports and ephemeral lifecycle without cloud SDKs
        run: .venv/bin/python scripts/qualify_durable_backend.py --level core --test-timeout 180 --receipts output/qualification/core
      - name: Publish sanitized core summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              for path in Path('output/qualification').rglob('receipt.json'):
                  receipt = json.loads(path.read_text())
                  summary.write(f"{receipt['level']}: exit {receipt['exit']}\n\n")
                  for run in receipt['runs']:
                      summary.write(f"Collected {run.get('collected', 'unverified')}; passed {run.get('passed', 'unverified')}; skips {run.get('skipped', 'unverified')}\n\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: durable-core-python310
          path: output/qualification/core
          retention-days: 7

  sdk-and-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install runtime, tests, and optional SDKs
        timeout-minutes: 10
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt -e '.[gcp]' psutil
      - name: Download official emulator (setup network only)
        run: |
          curl --fail --location --max-time 180 --output "$RUNNER_TEMP/firestore.jar" https://storage.googleapis.com/firebase-preview-drop/emulator/cloud-firestore-emulator-v1.22.0.jar
          echo '9b6498b7f62714d67f48f59b3818883cd682dbcd46b9f59511de81c97bb5166c  '"$RUNNER_TEMP/firestore.jar" | sha256sum --check
      - name: SDK-equipped injected-transport contracts (no credentials)
        run: .venv/bin/python scripts/qualify_durable_backend.py --level sdk --test-timeout 300 --receipts output/qualification/sdk
      - name: Independent-process emulator recovery, two fresh namespaces
        run: .venv/bin/python scripts/qualify_durable_backend.py --level emulator --emulator-jar "$RUNNER_TEMP/firestore.jar" --repeat 2 --test-timeout 300 --receipts output/qualification/emulator
      - name: Publish sanitized SDK and emulator summaries
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              for path in Path('output/qualification').rglob('receipt.json'):
                  receipt = json.loads(path.read_text())
                  summary.write(f"{receipt['level']}: exit {receipt['exit']}\n\n")
                  for run in receipt['runs']:
                      summary.write(f"Collected {run.get('collected', 'unverified')}; passed {run.get('passed', 'unverified')}; skips {run.get('skipped', 'unverified')}\n\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: durable-sdk-emulator-python310
          path: output/qualification
          retention-days: 7
