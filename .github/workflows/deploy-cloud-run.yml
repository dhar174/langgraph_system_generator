name: Deploy to Cloud Run

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-cloud-run-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
  ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.GCP_ARTIFACT_REGISTRY_REPOSITORY }}
  OPENAI_API_KEY_SECRET: ${{ vars.GCP_OPENAI_API_KEY_SECRET }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate required configuration
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
          GCP_ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.GCP_ARTIFACT_REGISTRY_REPOSITORY }}
          GCP_OPENAI_API_KEY_SECRET: ${{ vars.GCP_OPENAI_API_KEY_SECRET }}
          GCP_WORKLOAD_IDENTITY_PROVIDER_CONFIGURED: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
          GCP_SERVICE_ACCOUNT_CONFIGURED: ${{ secrets.GCP_SERVICE_ACCOUNT != '' }}
        run: |
          set -euo pipefail
          for value in GCP_PROJECT_ID GCP_REGION GCP_CLOUD_RUN_SERVICE GCP_ARTIFACT_REGISTRY_REPOSITORY GCP_OPENAI_API_KEY_SECRET; do
            if [ -z "${!value:-}" ]; then
              echo "::error::Missing required GitHub configuration: $value"
              exit 1
            fi
          done
          if [ "$GCP_WORKLOAD_IDENTITY_PROVIDER_CONFIGURED" != "true" ]; then
            echo "::error::Missing required GitHub configuration: GCP_WORKLOAD_IDENTITY_PROVIDER"
            exit 1
          fi
          if [ "$GCP_SERVICE_ACCOUNT_CONFIGURED" != "true" ]; then
            echo "::error::Missing required GitHub configuration: GCP_SERVICE_ACCOUNT"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        # google-github-actions/auth v3
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        # google-github-actions/setup-gcloud v3.0.1
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev"

      - name: Build and push image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/langgraph-system-generator:${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        id: deploy
        # google-github-actions/deploy-cloudrun v3.0.1
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          secrets: |-
            OPENAI_API_KEY=${{ env.OPENAI_API_KEY_SECRET }}:latest
          secrets_update_strategy: merge
          flags: --port=8000 --memory=2Gi --iap --no-allow-unauthenticated

      - name: Verify Cloud Run health
        shell: bash
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
          HEALTH_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "${SERVICE_URL:-}" ]; then
            echo "::error::Deploy step did not return a Cloud Run service URL"
            exit 1
          fi
          if [ -z "${HEALTH_SERVICE_ACCOUNT:-}" ]; then
            echo "::error::Health service account was not provided"
            exit 1
          fi

          trap 'rm -f /tmp/iap-health-claim.json /tmp/iap-health.jwt /tmp/cloud-run-health.json' EXIT

          issued_at="$(date +%s)"
          expires_at="$((issued_at + 600))"

          jq -n \
            --arg iss "$HEALTH_SERVICE_ACCOUNT" \
            --arg sub "$HEALTH_SERVICE_ACCOUNT" \
            --arg aud "${SERVICE_URL}/*" \
            --argjson iat "$issued_at" \
            --argjson exp "$expires_at" \
            '{iss:$iss, sub:$sub, aud:$aud, iat:$iat, exp:$exp}' \
            > /tmp/iap-health-claim.json

          gcloud iam service-accounts sign-jwt \
            --iam-account="$HEALTH_SERVICE_ACCOUNT" \
            /tmp/iap-health-claim.json \
            /tmp/iap-health.jwt

          for attempt in {1..30}; do
            http_status="$(
              curl --fail --silent --show-error --max-time 10 \
                --output /tmp/cloud-run-health.json \
                --write-out "%{http_code}" \
                --header "Authorization: Bearer $(cat /tmp/iap-health.jwt)" \
                "${SERVICE_URL}/health" || true
            )"

            if [ "$http_status" = "200" ]; then
              if grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/cloud-run-health.json; then
                echo "Cloud Run health check passed."
                exit 0
              fi
              echo "::error::Cloud Run /health did not report status ok"
              cat /tmp/cloud-run-health.json
              exit 1
            fi

            echo "Cloud Run /health returned HTTP ${http_status:-000}; waiting, attempt ${attempt}/30..."
            if [ -s /tmp/cloud-run-health.json ]; then
              head -c 500 /tmp/cloud-run-health.json
              echo
            fi
            sleep 5
          done

          echo "::error::Cloud Run /health did not respond successfully"
          exit 1

      - name: Show service URL
        run: |
          echo "Cloud Run URL here: ${{ steps.deploy.outputs.url }}"
