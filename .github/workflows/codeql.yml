name: CodeQL

# This workflow is intentionally reusable-only. Main-branch push scans are
# orchestrated by caller workflows such as wiki-from-code.yml and diagram.yml,
# while standalone PR/scheduled scans are handled by codeql-analysis.yml.
on:
  workflow_call:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["python"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
