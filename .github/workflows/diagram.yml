name: Create diagram

# NOTE: This workflow generates diagram updates through a pull request.
# Direct pushes to main are blocked by repository rules because generated
# commits need the same required checks and code scanning results as any
# other change.
# This workflow manages the legacy top-level `diagram.svg` generated by
# githubocto/repo-visualizer. The docs-owned Mermaid/DOT/JSON/Figma
# architecture bundle under `docs/diagrams/repo-architecture-visualizer/` is
# refreshed through the local `repo-architecture-visualizer` skill.

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  get_data:
    runs-on: ubuntu-latest
    needs: codeql
    permissions:
      contents: read
    steps:
      - name: Check diagram PR token
        id: diagram-token
        shell: bash
        env:
          DIAGRAM_PR_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$DIAGRAM_PR_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping diagram refresh because secrets.GH_PAT is not configured. Configure a PAT with repo/workflow scopes so automation PRs trigger required checks."
          fi

      - name: Checkout code
        if: steps.diagram-token.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Update diagram
        if: steps.diagram-token.outputs.available == 'true'
        uses: githubocto/repo-visualizer@0.9.1
        with:
          excluded_paths: "ignore,.github"
          root_path: "src/"
          commit_message: "Repo visualization diagram"
          should_push: false

      - name: Open diagram update PR
        if: steps.diagram-token.outputs.available == 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: "Update repo visualization diagram"
          title: "Update repo visualization diagram"
          body: |
            Automated repo visualization refresh generated by the Create diagram workflow.

            The workflow opens this pull request instead of pushing directly to `main`
            so branch protection and required checks can run normally.
          branch: automation/repo-visualization-diagram
          base: main
          delete-branch: true
          add-paths: diagram.svg
